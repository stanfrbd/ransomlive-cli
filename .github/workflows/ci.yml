name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check
      - run: uv run --locked ruff format --check
      - run: uv run --locked pre-commit run --all-files
      - run: uv run --locked pytest
      - run: uv build
      - name: Check wheel entry point
        run: uvx --from "$(echo dist/*.whl)" ransomlive --version
